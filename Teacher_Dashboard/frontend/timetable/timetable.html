<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Timetable Module — SSGMCE Teacher ERP Portal</title>
  
  <!-- Academic Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core ERP Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  
  <!-- Dedicated Timetable Module Stylesheet -->
  <link rel="stylesheet" href="timetable.css">

  <style>
    /* Standalone Module Page Layout Adjustments */
    body {
      background-color: var(--light-bg, #F4F8FC);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .timetable-module-standalone-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      width: 100%;
      flex: 1;
    }

    .standalone-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-back-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #FFFFFF;
      border: 1px solid var(--border-color, #E2E8F0);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--dark-navy, #0B1F3A);
      text-decoration: none;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .btn-back-dashboard:hover {
      background: #F0F7FF;
      border-color: var(--primary-blue, #0B5CAD);
      color: var(--primary-blue, #0B5CAD);
      transform: translateX(-2px);
    }

    .standalone-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #EBF3FC;
      border: 1px solid rgba(11, 92, 173, 0.18);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-blue, #0B5CAD);
    }

    .module-footer-note {
      text-align: center;
      padding: 24px 0 12px;
      font-size: 12px;
      color: var(--text-muted, #64748B);
    }
  </style>
</head>
<body>

  <!-- ========================================================
       TOP HEADER (SSGMCE Dark Navy #0B1F3A)
       ======================================================== -->
  <header class="app-header ssgmce-top-header" role="banner" style="position:sticky; top:0; z-index:40;">
    <div class="header-left header-left-brand" style="display:flex; align-items:center; gap:14px;">
      <a href="../index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
        <img src="../images/logo.png" alt="SSGMCE Crest" style="width:38px; height:38px; object-fit:contain; border-radius:6px; background:#fff; padding:2px;">
        <div>
          <div style="font-size:14px; font-weight:800; color:#fff; letter-spacing:-0.2px;">SHRI SANT GAJANAN MAHARAJ COLLEGE OF ENGINEERING</div>
          <div style="font-size:11px; color:#93C5FD; font-weight:600;">Faculty Portal • Timetable Scheduling Module</div>
        </div>
      </a>
    </div>

    <div class="header-right" style="display:flex; align-items:center; gap:14px;">
      <div style="display:flex; align-items:center; gap:10px; color:#fff; font-size:12.5px;">
        <span style="background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:8px; font-weight:600;">Dept. of CSE</span>
        <span style="font-weight:700;">Dr. J. M. Patil</span>
      </div>
    </div>
  </header>

  <!-- ========================================================
       STANDALONE TIMETABLE MODULE CONTAINER
       ======================================================== -->
  <main class="timetable-module-standalone-wrapper">
    
    <!-- Navigation Bar -->
    <div class="standalone-nav-bar">
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="../index.html" class="btn-back-dashboard">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
          <span>Back to Teacher Dashboard</span>
        </a>
      </div>

      <div class="standalone-badge">
        <i data-lucide="calendar" style="width:14px;height:14px;"></i>
        <span>Standalone Timetable Module</span>
      </div>
    </div>

    <!-- Timetable Dynamic Content Mount Point -->
    <div id="timetable-content" class="timetable-module-container">
      <!-- Generated dynamically by timetable.js -->
    </div>

    <div class="module-footer-note">
      <span>SSGMCE ERP Academic Portal &copy; 2026. Weekly Faculty Lecture & Lab Timetable Schedule.</span>
    </div>
  </main>

  <!-- Application Scripts -->
  <script src="../js/data.js"></script>
  <script src="timetable.js"></script>

  <!-- Module Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.TimetableModule) {
        TimetableModule.init('timetable-content');
      }
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
