<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Quiz Portal</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/quiz.css">
    <script src="js/api.js"></script>
    <script src="js/quiz-api.js"></script>
</head>
<body>
    <header><h1>Quizzes</h1></header>

    <section id="quiz-list">
        <p>Loading quizzes…</p>
    </section>

    <section id="quiz-attempt" class="hidden">
        <h2 id="quiz-title"></h2>
        <form id="attempt-form"></form>
        <button id="submit-attempt">Submit</button>
        <button id="cancel-attempt">Cancel</button>
    </section>

    <section id="quiz-result" class="hidden">
        <h2>Result</h2>
        <div id="result-content"></div>
        <button id="back-to-list">Back to Quizzes</button>
    </section>

    <script>
        // ----------------------------------------------------------------------
        // Helper to read user profile from localStorage (set during login)
        // ----------------------------------------------------------------------
        const profile = JSON.parse(localStorage.getItem('profile')) || {};
        if (!profile.studentId || !profile.classId) {
            alert('Profile missing – please log in again.');
            window.location = 'index.html';
        }

        // ----------------------------------------------------------------------
        // 1️⃣ Load quizzes for the student's class
        // ----------------------------------------------------------------------
        async function loadQuizzes() {
            const listEl = document.getElementById('quiz-list');
            listEl.innerHTML = '<p>Loading…</p>';
            try {
                const quizzes = await QuizAPI.getStudentQuizzes(profile.classId, profile.studentId);
                if (quizzes.length === 0) {
                    listEl.innerHTML = '<p>No quizzes available.</p>';
                    return;
                }
                listEl.innerHTML = '';
                quizzes.forEach(q => {
                    const div = document.createElement('div');
                    div.className = 'quiz-card';
                    div.innerHTML = `
                        <h3>${q.title}</h3>
                        <p>${q.description ?? ''}</p>
                        <p><strong>Duration:</strong> ${q.duration_minutes} min</p>
                        <button data-id="${q.id}" class="start-btn">Start</button>
                    `;
                    listEl.appendChild(div);
                });
                // attach click handlers
                document.querySelectorAll('.start-btn').forEach(btn =>
                    btn.addEventListener('click', () => startQuiz(btn.dataset.id))
                );
            } catch (e) {
                listEl.innerHTML = `<p class="error">Failed to load quizzes: ${e.message}</p>`;
            }
        }

        // ----------------------------------------------------------------------
        // 2️⃣ Start a quiz attempt
        // ----------------------------------------------------------------------
        async function startQuiz(quizId) {
            try {
                const attempt = await QuizAPI.startAttempt(quizId, profile.studentId);
                currentAttemptId = attempt.id;
                showAttempt(attempt);
            } catch (e) {
                alert('Unable to start attempt: ' + e.message);
            }
        }

        // ----------------------------------------------------------------------
        // 3️⃣ Render attempt UI (questions + options)
        // ----------------------------------------------------------------------
        let currentAttemptId = null;
        async function showAttempt(attempt) {
            document.getElementById('quiz-list').classList.add('hidden');
            const attemptSec = document.getElementById('quiz-attempt');
            attemptSec.classList.remove('hidden');
            document.getElementById('quiz-title').textContent = attempt.title || attempt.quiz_title || '';

            const form = document.getElementById('attempt-form');
            form.innerHTML = '';
            const questions = await QuizAPI.getAttemptQuestions(attempt.id);
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'question-block';
                div.innerHTML = `
                    <p><strong>Q${idx + 1}.</strong> ${q.text}</p>
                    ${q.options.map(o => `
                        <label>
                            <input type="radio" name="q_${q.id}" value="${o.key}" required>
                            ${o.key}. ${o.text}
                        </label><br>
                    `).join('')}
                `;
                form.appendChild(div);
            });
        }

        // ----------------------------------------------------------------------
        // 4️⃣ Submit attempt
        // ----------------------------------------------------------------------
        document.getElementById('submit-attempt').addEventListener('click', async () => {
            const form = document.getElementById('attempt-form');
            const answers = [];
            const inputs = form.querySelectorAll('input[type=radio]:checked');
            inputs.forEach(inp => {
                answers.push({ question_id: inp.name.split('_')[1], selected_key: inp.value });
            });
            try {
                const result = await QuizAPI.submitAttempt(currentAttemptId, answers);
                showResult(result);
            } catch (e) {
                alert('Submit failed: ' + e.message);
            }
        });

        // ----------------------------------------------------------------------
        // 5️⃣ Show result page
        // ----------------------------------------------------------------------
        function showResult(res) {
            document.getElementById('quiz-attempt').classList.add('hidden');
            const resSec = document.getElementById('quiz-result');
            resSec.classList.remove('hidden');
            const html = `
                <p><strong>Total Marks:</strong> ${res.total_marks}</p>
                <p><strong>Score:</strong> ${res.score_obtained}</p>
                <p><strong>Result:</strong> ${res.passed ? 'Passed' : 'Failed'}</p>
                <h3>Answers</h3>
                ${res.answers.map(a => `
                    <p>
                        <strong>${a.question_text}</strong><br>
                        Your answer: ${a.selected_key} – ${a.selected_text}<br>
                        Correct: ${a.is_correct ? '✅' : '❌'} (${a.correct_key} – ${a.correct_text})
                    </p>
                `).join('')}
            `;
            document.getElementById('result-content').innerHTML = html;
        }

        // ----------------------------------------------------------------------
        // 6️⃣ Navigation helpers
        // ----------------------------------------------------------------------
        document.getElementById('cancel-attempt').addEventListener('click', () => location.reload());
        document.getElementById('back-to-list').addEventListener('click', () => {
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-list').classList.remove('hidden');
            loadQuizzes();
        });

        // ----------------------------------------------------------------------
        // Init
        // ----------------------------------------------------------------------
        loadQuizzes();
    </script>
</body>
</html>
