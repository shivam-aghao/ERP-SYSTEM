services:
  postgres:
    image: postgres:16-alpine
    container_name: ssgmce_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_secret_pass
      POSTGRES_DB: ssgmce_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d ssgmce_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ssgmce_erp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssgmce_erp_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://erp_admin:erp_secret_pass@postgres:5432/ssgmce_erp?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ssgmce_super_secure_jwt_access_secret_key_2026_x94j2!
      JWT_REFRESH_SECRET: ssgmce_super_secure_jwt_refresh_secret_key_2026_q83m7!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500"
      LOG_LEVEL: info

volumes:
  pgdata:
  redisdata:
